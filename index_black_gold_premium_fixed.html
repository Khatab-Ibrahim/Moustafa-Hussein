<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Moustafa Hussein | Connect with me</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

:root {
  --black:#050505;
  --black2:#0b0b0b;
  --gold:#c9a45c;
  --gold2:#f1d18a;
  --gold3:#8c6a2f;
  --white:#f5f2eb;
  --muted:#8d8980;
  --line:rgba(201,164,92,.24);
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
  min-height:100vh;
  color:var(--white);
  background:
    radial-gradient(circle at 50% -10%, rgba(201,164,92,.11), transparent 34%),
    radial-gradient(circle at 0% 100%, rgba(201,164,92,.07), transparent 30%),
    var(--black);
  font-family:'Montserrat',Arial,sans-serif;
  display:flex;
  justify-content:center;
  padding:24px 14px;
  overflow-x:hidden;
}

body::before {
  content:"";
  position:fixed;
  inset:-40%;
  pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0 30%, rgba(201,164,92,.055) 38%, transparent 46% 100%);
  animation:slowRotate 24s linear infinite;
}

@keyframes slowRotate { to { transform:rotate(360deg); } }

.page {
  width:100%;
  max-width:455px;
  position:relative;
  z-index:1;
}

.card {
  position:relative;
  overflow:hidden;
  min-height:calc(100vh - 48px);
  padding:38px 19px 25px;
  border:1px solid rgba(201,164,92,.34);
  border-radius:28px;
  background:linear-gradient(145deg,rgba(20,19,17,.94),rgba(6,6,6,.97));
  box-shadow:
    0 35px 100px rgba(0,0,0,.72),
    inset 0 1px rgba(255,255,255,.055),
    0 0 45px rgba(201,164,92,.035);
}

.card::before {
  content:"";
  position:absolute;
  width:360px;
  height:360px;
  top:-250px;
  left:50%;
  transform:translateX(-50%);
  border-radius:50%;
  border:1px solid rgba(201,164,92,.10);
  box-shadow:0 0 80px rgba(201,164,92,.07);
}

.card::after {
  content:"";
  position:absolute;
  top:-20%;
  left:-100%;
  width:55%;
  height:140%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.035),transparent);
  transform:skewX(-18deg);
  animation:luxurySweep 8s ease-in-out infinite;
  pointer-events:none;
}

@keyframes luxurySweep {
  0%,55% { left:-100%; }
  78%,100% { left:150%; }
}

.top {
  position:relative;
  z-index:2;
  text-align:center;
  animation:fadeUp .9s ease both;
}

.avatar-ring {
  width:104px;
  height:104px;
  margin:0 auto 20px;
  padding:2px;
  border-radius:50%;
  position:relative;
  background:#090909;
  box-shadow:
    0 0 0 1px rgba(201,164,92,.18),
    0 0 32px rgba(201,164,92,.16);
  animation:ringRotate 10s linear infinite;
}

.avatar-ring::before {
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:50%;
  border:1px solid rgba(201,164,92,.16);
  animation:ringPulse 3s ease-in-out infinite;
}

.avatar {
  width:100%;
  height:100%;
  border-radius:50%;
  display:block;
  object-fit:cover;
  object-position:center 22%;
  background:#090909;
  animation:ringCounter 10s linear infinite;
}

@keyframes ringRotate { to { transform:rotate(360deg); } }
@keyframes ringCounter { to { transform:rotate(-360deg); } }
@keyframes ringPulse {
  50% { transform:scale(1.06); opacity:.45; }
}

h1 {
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:46px;
  line-height:.95;
  font-weight:600;
  letter-spacing:.4px;
}

h1 span {
  color:var(--gold2);
  text-shadow:0 0 24px rgba(201,164,92,.12);
}

.subtitle {
  margin-top:13px;
  color:#aaa49a;
  font-size:10px;
  font-weight:600;
  letter-spacing:5px;
  text-transform:uppercase;
}

.ornament {
  width:120px;
  height:1px;
  margin:20px auto 0;
  position:relative;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.ornament::after {
  content:"◆";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.55);
  padding:0 9px;
  color:var(--gold2);
  background:#0b0b0b;
  font-size:13px;
}

.links {
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:30px;
}

.link-card {
  min-height:78px;
  position:relative;
  display:flex;
  align-items:center;
  padding:13px 48px 13px 14px;
  overflow:hidden;
  text-decoration:none;
  color:var(--white);
  border:1px solid rgba(201,164,92,.20);
  border-radius:18px;
  background:linear-gradient(110deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  box-shadow:inset 0 1px rgba(255,255,255,.035);
  opacity:0;
  transform:translateY(20px);
  animation:cardIn .7s cubic-bezier(.2,.8,.2,1) forwards;
  transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease,background .35s ease;
}

.link-card:nth-child(1) { animation-delay:.18s; }
.link-card:nth-child(2) { animation-delay:.34s; }
.link-card:nth-child(3) { animation-delay:.50s; }

.link-card::before {
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:-2px;
  width:2px;
  background:linear-gradient(180deg,transparent,var(--gold2),transparent);
  opacity:.7;
}

.link-card::after {
  content:"";
  position:absolute;
  top:-100%;
  left:-20%;
  width:45%;
  height:300%;
  background:linear-gradient(90deg,transparent,rgba(241,209,138,.09),transparent);
  transform:rotate(18deg);
  transition:transform .8s ease;
}

.link-card:hover {
  transform:translateY(-4px);
  border-color:rgba(201,164,92,.62);
  background:linear-gradient(110deg,rgba(201,164,92,.075),rgba(255,255,255,.018));
  box-shadow:0 16px 35px rgba(0,0,0,.38),0 0 25px rgba(201,164,92,.07);
}

.link-card:hover::after { transform:translateX(280%) rotate(18deg); }

@keyframes cardIn {
  to { opacity:1; transform:translateY(0); }
}

.icon {
  width:49px;
  height:49px;
  flex:0 0 49px;
  margin-right:15px;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:1px solid rgba(201,164,92,.42);
  color:var(--gold2);
  background:radial-gradient(circle,#1c1913,#080808 70%);
  font-size:11px;
  font-weight:700;
  letter-spacing:.8px;
  box-shadow:inset 0 0 18px rgba(201,164,92,.06);
  transition:transform .35s ease,box-shadow .35s ease;
}

.link-card:hover .icon {
  transform:scale(1.08) rotate(-5deg);
  box-shadow:0 0 22px rgba(201,164,92,.16),inset 0 0 18px rgba(201,164,92,.08);
}

.name {
  display:block;
  font-size:14px;
  font-weight:600;
  letter-spacing:.2px;
}

.desc {
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.35;
}

.arrow {
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:25px;
  transition:transform .3s ease,color .3s ease;
}

.link-card:hover .arrow {
  transform:translate(4px,-50%);
  color:var(--gold2);
}

.footer {
  position:relative;
  z-index:2;
  margin-top:28px;
  text-align:center;
  color:#716c64;
  font-size:8px;
  font-weight:600;
  letter-spacing:3px;
}

.crown {
  color:var(--gold);
  font-size:17px;
  margin-bottom:10px;
  animation:goldPulse 2.8s ease-in-out infinite;
}

@keyframes goldPulse {
  50% { text-shadow:0 0 18px rgba(201,164,92,.55); transform:translateY(-2px); }
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(18px); }
  to { opacity:1; transform:translateY(0); }
}

@media (max-width:380px) {
  .card { padding:30px 14px 22px; border-radius:23px; }
  h1 { font-size:39px; }
  .avatar-ring { width:92px; height:92px; }
}

@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}

/* Premium motion layer */
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 25%,rgba(241,209,138,.06),transparent 18%),
    radial-gradient(circle at 80% 70%,rgba(201,164,92,.05),transparent 22%);
  animation:ambientGlow 7s ease-in-out infinite alternate;
}
.page::before,.page::after{
  content:"";
  position:fixed;
  width:5px;height:5px;border-radius:50%;
  background:var(--gold2);
  box-shadow:
    0 0 10px var(--gold2),
    0 0 25px rgba(241,209,138,.7);
  opacity:.45;
  pointer-events:none;
  z-index:3;
}
.page::before{left:10%;top:75%;animation:floatSpark 6s ease-in-out infinite;}
.page::after{right:12%;top:25%;animation:floatSpark 8s 1s ease-in-out infinite reverse;}

.card{animation:cardBreath 6s ease-in-out infinite;}
.avatar-ring{animation:ringRotate 10s linear infinite;}
.avatar{animation:none !important;}
.avatar-ring::after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:50%;
  background:conic-gradient(
    from 0deg,
    transparent 0deg 45deg,
    var(--gold3) 65deg,
    var(--gold2) 90deg,
    var(--gold) 115deg,
    transparent 145deg 235deg,
    var(--gold3) 255deg,
    var(--gold2) 285deg,
    transparent 315deg 360deg
  );
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
  animation:frameRotate 7s linear infinite;
  pointer-events:none;
  z-index:1;
}
.link-card{will-change:transform;}
.link-card:nth-child(1){animation:cardIn .7s .18s cubic-bezier(.2,.8,.2,1) forwards, cardFloat 4.8s 1.4s ease-in-out infinite;}
.link-card:nth-child(2){animation:cardIn .7s .34s cubic-bezier(.2,.8,.2,1) forwards, cardFloat 5.2s 1.7s ease-in-out infinite;}
.link-card:nth-child(3){animation:cardIn .7s .50s cubic-bezier(.2,.8,.2,1) forwards, cardFloat 5.6s 2s ease-in-out infinite;}
.icon svg{width:27px;height:27px;display:block;filter:drop-shadow(0 0 7px rgba(241,209,138,.22));}
.social-wa{color:#d8bd79;}
.social-ig{color:#e9d28f;}
.social-fb{color:#e9d28f;}
.icon{position:relative;}
.icon::after{
  content:"";
  position:absolute;
  inset:-5px;
  border-radius:50%;
  border:1px solid rgba(201,164,92,.12);
  animation:iconPulse 2.8s ease-in-out infinite;
}
@keyframes ambientGlow{from{opacity:.55;transform:scale(1)}to{opacity:1;transform:scale(1.04)}}
@keyframes cardBreath{50%{box-shadow:0 35px 100px rgba(0,0,0,.72),inset 0 1px rgba(255,255,255,.055),0 0 58px rgba(201,164,92,.07)}}
@keyframes avatarFloat{50%{transform:translateY(-4px)}}
@keyframes photoZoom{50%{transform:rotate(-180deg) scale(1.025)}}
@keyframes cardFloat{50%{transform:translateY(-3px)}}
@keyframes floatSpark{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(20px,-28px);opacity:.8}}
@keyframes iconPulse{50%{transform:scale(1.12);opacity:.25}}


/* Final tweak: photo stays perfectly still; only the gold frame animates */
.avatar {
  position:relative;
  z-index:2;
  transform:none !important;
  animation:none !important;
}
.avatar-ring {
  animation: ringRotate 10s linear infinite !important;
  transform-origin: center;
}


/* FINAL AVATAR FIX: photo is static; only the gold frame rotates */
.avatar-ring{
  animation:none !important;
  transform:none !important;
  isolation:isolate;
}
.avatar-ring::after{
  transform-origin:center;
}
@keyframes frameRotate{
  to{transform:rotate(360deg);}
}

</style>
</head>
